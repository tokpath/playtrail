name: playtrail

# Production topology (TECH-STACK §7): only Caddy publishes ports.
# Caddy listens on fixed container ports (8080/8443) so that the published
# host ports are the only difference between a local run
# (SITE_ADDRESS=:8080) and a VPS run (SITE_ADDRESS=example.com).

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-playtrail}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-playtrail}?sslmode=disable}
  API_ADDR: ${API_ADDR:-:8081}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://web:3000}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
  MEDIA_DIR: ${MEDIA_DIR:-/data/media}
  OPS_TIMEZONE: ${OPS_TIMEZONE:-Asia/Taipei}
  SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-en,zh}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
  LOCALE_MIN_GAMES: ${LOCALE_MIN_GAMES:-10}
  SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
  # Real client IP header behind Cloudflare; honored only for
  # private-network peers (backend/.env.example).
  TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
  EXTERNAL_COVERS_ENABLED: ${EXTERNAL_COVERS_ENABLED:-true}
  CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
  CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-}
  CRAWLER_DAILY_CAP: ${CRAWLER_DAILY_CAP:-3000}
  CRAWLER_MIN_INTERVAL: ${CRAWLER_MIN_INTERVAL:-2s}
  CRAWLER_OBSERVED_REGION: ${CRAWLER_OBSERVED_REGION:-TW}
  HOT_AUTO_PUBLISH: ${HOT_AUTO_PUBLISH:-true}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTPS_PORT:-443}:8443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  web:
    build: ../web
    image: playtrail-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8081
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-en,zh}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}

  api:
    build: ../backend
    image: playtrail-api
    restart: unless-stopped
    command: ["serve"]
    environment: *backend-env
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/api/meta?locale=en"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: ../backend
    image: playtrail-api
    restart: unless-stopped
    command: ["worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: ../backend
    image: playtrail-api
    restart: "no"
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playtrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-playtrail}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  media:
  caddy-data:
  caddy-config:
