        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, ignore] }
                revisionVersion: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/tag-mappings:
    get:
      tags: [admin]
      summary: Source tag mappings (crawler-owned)
      operationId: adminListTagMappings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sourceTagSlug]
                      properties:
                        sourceTagSlug: { type: string }
                        tagSlug: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/tag-mappings/{sourceTagSlug}:
    put:
      tags: [admin]
      summary: Set (or clear) a source tag mapping (crawler-owned)
      operationId: adminPutTagMapping
      parameters:
        - name: sourceTagSlug
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagSlug]
              properties:
                tagSlug: { type: [string, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sourceTagSlug]
                      properties:
                        sourceTagSlug: { type: string }
                        tagSlug: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/crawler:
    get:
      tags: [admin]
      summary: Crawler status (crawler-owned)
      operationId: adminGetCrawler
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlerStatus' }
        '401': { $ref: '#/components/responses/Error401' }
    patch:
      tags: [admin]
      summary: Update crawler settings (crawler-owned)
      operationId: adminPatchCrawler
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                dailyCap: { type: integer, minimum: 0 }
                minIntervalMs: { type: integer, minimum: 2000 }
                hotAutoPublish: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrawlerStatus' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/crawler/run:
    post:
      tags: [admin]
      summary: Trigger a crawler run (crawler-owned)
      operationId: adminRunCrawler
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, enum: [sitemap, tracked, backfill, hot] }
      responses:
        '202': { description: Accepted }
        '401': { $ref: '#/components/responses/Error401' }

components:
  parameters:
    Locale:
      name: locale
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Locale' }
    LocalePath:
      name: locale
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Locale' }
    GameID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Origin:
      name: Origin
      in: header
      required: false
      schema: { type: string }
      description: Trusted origin (PUBLIC_BASE_URL) or same-origin; enforced by CSRF protection on writes.

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error401:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error403:
      description: Forbidden (CSRF or permissions)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error404:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error409:
      description: Revision conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error410:
      description: Gone (unlisted)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error413:
      description: Payload too large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error415:
      description: Unsupported media type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error422:
      description: Validation or publish gate failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error429:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    Locale:
      type: string
      enum: [en, zh]

    ErrorCode:
      type: string
      enum:
        - INVALID_PARAM
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - GONE
        - REVISION_CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - PUBLISH_GATE_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR

    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
        requestId: { type: string }

    Ref:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    Image:
      type: object
      required: [url, width, height, alt, srcset, source, shareUrl]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
        alt: { type: string }
        srcset:
          type: array
          items:
            type: object
            required: [url, width]
            properties:
              url: { type: string }
              width: { type: integer }
        source: { type: string, enum: [self, crazygames], description: 'self: use no-referrer; crazygames: hotlinked CDN image (PRD 22.12).' }
        shareUrl: { type: string, description: 1200x630 share image URL. }

    GameSummary:
      type: object
      required: [id, slug, name, alias, summary, primaryCategory, tags, cover, outboundAllowed]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        alias: { type: string }
        summary: { type: string }
        primaryCategory: { $ref: '#/components/schemas/Ref' }
        tags:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Ref' }
        cover:
          oneOf:
            - { $ref: '#/components/schemas/Image' }
            - type: 'null'
        outboundAllowed: { type: boolean }

    GameCard:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          properties:
            tags:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/Ref' }

    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required:
            - description
            - controls
            - developer
            - deviceSupport
            - deviceEvidence
            - sourceUrl
            - sourceFetchedAt
            - screenshots
            - ctaUrl
            - outboundAllowed
            - outboundBlockedReason
            - availableLocales
            - firstPublishedAt
            - publishedAt
            - related
          properties:
            tags:
              type: array
              maxItems: 8
              items: { $ref: '#/components/schemas/Ref' }
            description: { type: string }
            controls: { type: string }
            developer: { type: string }
            deviceSupport: { type: string, enum: [unknown, desktop, mobile, both] }
            deviceEvidence:
              oneOf:
                - type: object
                  required: [url, checkedAt]
                  properties:
                    url: { type: string }
                    checkedAt: { type: string, format: date-time }
                - type: 'null'
            sourceUrl: { type: string }
            sourceFetchedAt: { type: string, format: date-time }
            screenshots: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Image' } }
            ctaUrl: { type: string }
            outboundAllowed: { type: boolean }
            outboundBlockedReason: { type: [string, 'null'], enum: [link_unavailable, null] }
            availableLocales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
            firstPublishedAt: { type: string, format: date-time }
            publishedAt: { type: string, format: date-time }
            related: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/GameCard' } }

    GameList:
      type: object
      required: [items, total, page, pageSize, totalPages, appliedFilters]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GameCard' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 48 }
        totalPages: { type: integer, minimum: 0 }
        appliedFilters:
          type: object
          required: [q, category, tag, sort]
          properties:
            q: { type: [string, 'null'] }
            category: { type: [string, 'null'] }
            tag: { type: [string, 'null'] }
            sort: { type: string, enum: [editorial, newest] }

    HotSnapshot:
      type: object
      required: [snapshotId, sourceUrl, sourceFetchedAt, observedRegion, definition, stale, items]
      properties:
        snapshotId: { type: string, format: uuid }
        sourceUrl: { type: string }
        sourceFetchedAt: { type: string, format: date-time }
        observedRegion: { type: string }
        definition: { type: string }
        stale: { type: boolean }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [position, game]
            properties:
              position: { type: integer, minimum: 1 }
              game: { $ref: '#/components/schemas/GameCard' }

    CategoryCount:
      allOf:
        - $ref: '#/components/schemas/Ref'
        - type: object
          required: [count, sortOrder]
          properties:
            count: { type: integer, minimum: 0 }
            sortOrder: { type: integer }

    HomeCategory:
      allOf:
        - $ref: '#/components/schemas/CategoryCount'
        - type: object
          required: [leadingGames]
          properties:
            leadingGames:
              description: The category's first games that have cover art, in editorial order (for the home tile collage). Empty when none has a cover.
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/GameCard' }

    TagCount:
      allOf:
        - $ref: '#/components/schemas/Ref'
        - type: object
          required: [count]
          properties:
            count: { type: integer, minimum: 0 }

    LocalizedNames:
      type: object
      additionalProperties: { type: string }

    AdminCategory:
      type: object
      required: [slug, names, sourceUrl, sortOrder]
      properties:
        slug: { type: string }
        names: { $ref: '#/components/schemas/LocalizedNames' }
        sourceUrl: { type: string }
        sortOrder: { type: integer }

    AdminTag:
      type: object
      required: [slug, names, active, createdAt]
      properties:
        slug: { type: string }
        names: { $ref: '#/components/schemas/LocalizedNames' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    GateReport:
      type: object
      required: [game, locales]
      properties:
        game:
          type: object
          required: [ok, failures]
          properties:
            ok: { type: boolean }
            failures:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
        locales:
          type: object
          additionalProperties:
            type: object
            required: [ok, failures]
            properties:
              ok: { type: boolean }
              failures:
                type: array
                items:
                  type: object
                  required: [field, message]
                  properties:
                    field: { type: string }
                    message: { type: string }

    AdminGame:
      type: object
      required:
        - id
        - slug
        - platform
        - externalUrl
        - status
        - statusReason
        - linkStatus
        - linkCheckedAt
        - linkCheckMethod
