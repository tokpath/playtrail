        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SourceGameRow' } }
                  total: { type: integer }
                  page: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/source-games/{id}:
    get:
      tags: [admin]
      summary: One source game with reference material (crawler-owned)
      operationId: adminGetSourceGame
      parameters:
        - name: id
