        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SourceChange' } }
                  total: { type: integer }
                  page: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/source-changes/{id}/resolve:
    post:
