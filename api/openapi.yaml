          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsReport' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/audit:
    get:
      tags: [admin]
      summary: Audit log
      operationId: adminAudit
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
