openapi: 3.1.0
info:
  title: PlayTrail API
  version: 1.0.0
  description: >-
    Backend API for PlayTrail, a multilingual browser-game discovery site.
    Mirrors docs/ARCHITECTURE.md section 6 exactly. All paths are prefixed
    with /api. Public endpoints require a `locale` in SUPPORTED_LOCALES.
    JSON fields are camelCase; times are RFC 3339 with offset.
servers:
  - url: http://localhost:3000
    description: Local development (Next.js rewrites /api/* to Go)
tags:
  - name: public
  - name: admin
security: []

paths:
  /api/meta:
    get:
      tags: [public]
      summary: Supported and live locales
      operationId: getMeta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [supportedLocales, liveLocales, defaultLocale]
                properties:
                  supportedLocales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
                  liveLocales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
                  defaultLocale: { $ref: '#/components/schemas/Locale' }

  /api/home:
    get:
      tags: [public]
      summary: Homepage aggregation
      operationId: getHome
      parameters:
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [featured, hot, categories, totalGames]
                properties:
                  featured: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/GameCard' } }
                  hot: { oneOf: [{ $ref: '#/components/schemas/HotSnapshot' }, { type: 'null' }] }
                  categories: { type: array, items: { $ref: '#/components/schemas/HomeCategory' } }
                  totalGames: { type: integer, minimum: 0 }
                  updatedAt: { type: [string, 'null'], format: date-time, description: Latest published_at among live games in the locale. }
        '400': { $ref: '#/components/responses/Error400' }

  /api/games:
    get:
      tags: [public]
      summary: Search and list published games
      operationId: listGames
      parameters:
        - { $ref: '#/components/parameters/Locale' }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
          description: Literal substring match on the locale's search text. Trimmed; empty means no keyword.
        - name: category
          in: query
          schema: { type: string }
          description: Category slug; unknown slug is a 400.
        - name: tag
          in: query
          schema: { type: string }
          description: Tag slug; unknown slug is a 400.
        - name: sort
          in: query
          schema: { type: string, enum: [editorial, newest], default: editorial }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameList' }
        '400': { $ref: '#/components/responses/Error400' }

  /api/games/{slug}:
    get:
      tags: [public]
      summary: Published game detail in a locale
      operationId: getGame
      parameters:
        - { $ref: '#/components/parameters/Locale' }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
        '404': { $ref: '#/components/responses/Error404' }
        '410': { $ref: '#/components/responses/Error410' }

  /api/categories:
    get:
      tags: [public]
      summary: Categories with published games in this locale
      operationId: listCategories
      parameters:
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CategoryCount' } }
        '400': { $ref: '#/components/responses/Error400' }

  /api/categories/{slug}:
    get:
      tags: [public]
      summary: One category with its published count in this locale
      operationId: getCategory
      parameters:
        - { $ref: '#/components/parameters/Locale' }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [category]
                properties:
                  category: { $ref: '#/components/schemas/CategoryCount' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/tags:
    get:
      tags: [public]
      summary: Tags with published games in this locale
      operationId: listTags
      parameters:
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TagCount' } }
        '400': { $ref: '#/components/responses/Error400' }

  /api/hot:
    get:
      tags: [public]
      summary: Latest active approved hot snapshot
      operationId: getHot
      parameters:
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: OK. snapshot is null when there is no approved snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot: { oneOf: [{ $ref: '#/components/schemas/HotSnapshot' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/Error400' }

  /api/sitemap:
    get:
      tags: [public]
      summary: Sitemap entries for published games and non-empty categories
      operationId: getSitemap
      parameters:
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [games, categories]
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      required: [slug, updatedAt, locales]
                      properties:
                        slug: { type: string }
                        updatedAt: { type: string, format: date-time }
                        locales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
                  categories:
                    type: array
                    items:
                      type: object
                      required: [slug, locales]
                      properties:
                        slug: { type: string }
                        locales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
        '400': { $ref: '#/components/responses/Error400' }

  /api/unlisted-slugs:
    get:
      tags: [public]
      summary: Slugs of unlisted games, for the web proxy's 410 rewrite
      operationId: getUnlistedSlugs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [slugs]
                properties:
                  slugs: { type: array, items: { type: string } }

  /api/events:
    post:
      tags: [public]
      summary: Ingest an analytics event
      operationId: postEvent
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '202': { description: Accepted. The event is not guaranteed to be stored. }
        '400': { $ref: '#/components/responses/Error400' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/_test/clock:
    post:
      tags: [public]
      summary: Set the test clock (e2e build tag only)
      operationId: setTestClock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [now]
              properties:
                now: { type: string, format: date-time }
      responses:
        '204': { description: Clock set }
        '400': { $ref: '#/components/responses/Error400' }
    delete:
      tags: [public]
      summary: Reset the test clock to wall time (e2e build tag only)
      operationId: resetTestClock
      responses:
        '204': { description: Clock reset }

  /api/admin/login:
    post:
      tags: [admin]
      summary: Log in
      operationId: adminLogin
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '204':
          description: 'Logged in; session cookie set'
        '401': { $ref: '#/components/responses/Error401' }
        '429': { $ref: '#/components/responses/Error429' }

  /api/admin/logout:
    post:
      tags: [admin]
      summary: Log out
      operationId: adminLogout
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/me:
    get:
      tags: [admin]
      summary: Current admin
      operationId: adminMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/password:
    post:
      tags: [admin]
      summary: Change password, revoking all sessions
      operationId: adminChangePassword
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        '204':
          description: 'Password changed; all sessions revoked'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/dashboard:
    get:
      tags: [admin]
      summary: Dashboard counters, live locales, crawler status, hot snapshot state
      operationId: adminDashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [counts, liveLocales, crawler, hot]
                properties:
                  counts:
                    type: object
                    required: [draft, published, unlisted, pendingReview, suspectLinks, sourceChangesPending]
                    properties:
                      draft: { type: integer }
                      published: { type: integer }
                      unlisted: { type: integer }
                      pendingReview: { type: integer }
                      suspectLinks: { type: integer }
                      sourceChangesPending: { type: integer }
                  liveLocales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
                  crawler: { $ref: '#/components/schemas/CrawlerStatus' }
                  hot:
                    oneOf:
                      - type: object
                        required: [sourceFetchedAt, stale]
                        properties:
                          sourceFetchedAt: { type: string, format: date-time }
                          stale: { type: boolean }
                      - type: 'null'

  /api/admin/games:
    get:
      tags: [admin]
      summary: Admin game list
      operationId: adminListGames
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, unlisted] }
        - name: linkStatus
          in: query
          schema: { type: string, enum: [unchecked, valid, suspect, invalid] }
        - name: review
          in: query
          schema: { type: string, enum: [needs_review, approved] }
        - name: locale
          in: query
          schema: { $ref: '#/components/schemas/Locale' }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, default: 24 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGameList' }
        '401': { $ref: '#/components/responses/Error401' }
    post:
      tags: [admin]
      summary: Create a draft game
      operationId: adminCreateGame
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, externalUrl, sourceUrl, sourceFetchedAt]
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
                externalUrl: { type: string }
                sourceUrl: { type: string }
                sourceFetchedAt: { type: string, format: date-time }
                slug: { type: string }
                primaryCategory: { type: string }
                tags: { type: array, maxItems: 8, items: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/games/{id}:
    get:
      tags: [admin]
      summary: Admin game detail
      operationId: adminGetGame
      parameters:
        - { $ref: '#/components/parameters/GameID' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [admin]
      summary: Patch the draft revision of a game
      operationId: adminPatchGame
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGamePatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/admin/games/{id}/locales/{locale}/review:
    post:
      tags: [admin]
      summary: Approve or reject one locale's content review
      operationId: adminReviewLocale
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/LocalePath' }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionVersion, decision, confirmOriginal, confirmFactsVerified]
              properties:
                revisionVersion: { type: integer }
                decision: { type: string, enum: [approved, rejected] }
                confirmOriginal: { type: boolean, enum: [true] }
                confirmFactsVerified: { type: boolean, enum: [true] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }

  /api/admin/games/{id}/link-check:
    post:
      tags: [admin]
      summary: Record a manual link check result
      operationId: adminLinkCheck
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [valid, suspect, invalid] }
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/games/{id}/gates:
    get:
      tags: [admin]
      summary: Publish gate report
      operationId: adminGates
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - name: locales
          in: query
          schema: { type: string }
          description: Comma-separated locales; defaults to the candidate revision's locales.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateReport' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/games/{id}/publish:
    post:
      tags: [admin]
      summary: Publish the candidate revision to the requested locales
      operationId: adminPublish
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionVersion]
              properties:
                revisionVersion: { type: integer }
                locales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }
        '422': { $ref: '#/components/responses/Error422' }

  /api/admin/games/{id}/unlist:
    post:
      tags: [admin]
      summary: Unlist a published game
      operationId: adminUnlist
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/games/{id}/outbound:
    post:
      tags: [admin]
      summary: Enable or disable the outbound CTA
      operationId: adminOutbound
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGame' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/games/{id}/preview:
    get:
      tags: [admin]
      summary: Preview the draft (or last published) revision as GameDetail
      operationId: adminPreview
      parameters:
        - { $ref: '#/components/parameters/GameID' }
        - { $ref: '#/components/parameters/Locale' }
      responses:
        '200':
          description: 'OK; response uses Cache-Control: no-store'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/media:
    post:
      tags: [admin]
      summary: Upload an image asset (JPEG/PNG/WebP, max 2 MB), re-encoded to WebP variants
      operationId: adminUploadMedia
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '413': { $ref: '#/components/responses/Error413' }
        '415': { $ref: '#/components/responses/Error415' }

  /api/admin/media/{id}:
    get:
      tags: [admin]
      summary: Fetch one media asset (admin UI rights display)
      operationId: adminGetMedia
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      tags: [admin]
      summary: Update media rights and review state
      operationId: adminPatchMedia
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rightsType: { type: string, enum: [original, licensed, unknown] }
                rightsEvidenceRef: { type: string }
                rightsNote: { type: string }
                reviewState: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/categories:
    get:
      tags: [admin]
      summary: Full category dictionary
      operationId: adminListCategories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/categories/{slug}:
    patch:
      tags: [admin]
      summary: Update a category's names or sort order
      operationId: adminPatchCategory
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names: { $ref: '#/components/schemas/LocalizedNames' }
                sortOrder: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/tags:
    get:
      tags: [admin]
      summary: Full tag dictionary
      operationId: adminListTags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminTag' } }
        '401': { $ref: '#/components/responses/Error401' }
    post:
      tags: [admin]
      summary: Create a tag
      operationId: adminCreateTag
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, names]
              properties:
                slug: { type: string }
                names: { $ref: '#/components/schemas/LocalizedNames' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTag' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/tags/{slug}:
    patch:
      tags: [admin]
      summary: Update a tag's names or active flag
      operationId: adminPatchTag
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names: { $ref: '#/components/schemas/LocalizedNames' }
                active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTag' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/hot-snapshots:
    get:
      tags: [admin]
      summary: Hot snapshot batches
      operationId: adminListHotSnapshots
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminHotSnapshot' } }
        '401': { $ref: '#/components/responses/Error401' }
    post:
      tags: [admin]
      summary: Create a hot snapshot batch
      operationId: adminCreateHotSnapshot
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceUrl, sourceFetchedAt, observedRegion, definition, items]
              properties:
                sourceUrl: { type: string }
                sourceFetchedAt: { type: string, format: date-time }
                observedRegion: { type: string }
                definition: { type: string }
                cacheNote: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [position, sourceSlug]
                    properties:
                      position: { type: integer, minimum: 1 }
                      sourceSlug: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHotSnapshot' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }

  /api/admin/hot-snapshots/{id}/review:
    post:
      tags: [admin]
      summary: Approve or reject a snapshot batch
      operationId: adminReviewHotSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHotSnapshot' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/hot-snapshots/{id}/deactivate:
    post:
      tags: [admin]
      summary: Deactivate a snapshot batch
      operationId: adminDeactivateHotSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Origin' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHotSnapshot' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /api/admin/imports/preview:
    post:
      tags: [admin]
      summary: Validate a JSON import file and store a preview
      operationId: adminImportPreview
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportFile' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '413': { $ref: '#/components/responses/Error413' }

  /api/admin/imports/commit:
    post:
      tags: [admin]
      summary: Commit a previewed import as drafts
      operationId: adminImportCommit
      parameters:
        - { $ref: '#/components/parameters/Origin' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewId, importKey]
